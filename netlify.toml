[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Aplikace má vlastní směrování v prohlížeči – všechny cesty vede na index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Service worker se nesmí cachovat, jinak by zařízení zůstalo na staré verzi.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
